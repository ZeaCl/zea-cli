name: "Temp — Extract NPM_TOKEN"

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Output encoded token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ENCODED=$(echo -n "${NPM_TOKEN}" | base64)
          echo "TOKEN_B64=${ENCODED}"
