name: "Temp — Sync NPM_TOKEN to AWS"

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync NPM_TOKEN to AWS Secrets Manager
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: sa-east-1
        run: |
          aws secretsmanager put-secret-value \
            --secret-id zea/npm/token \
            --secret-string "{\"NPM_TOKEN\":\"${NPM_TOKEN}\"}" \
            --region sa-east-1
          echo "✅ NPM_TOKEN synced to AWS Secrets Manager"
