name: Validate CLI Core

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install CLI core
        run: |
          npm ci
          npm link
          zea --version

      - name: Run core validation
        run: ./scripts/validate.sh
